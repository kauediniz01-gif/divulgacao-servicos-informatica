
name: CI - Testes e Build

on:
  push:
    branches:
      - main
      - revisao-tecnica-mvp
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Testes do Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Criar banco de dados
        run: |
          python init_db.py
          python seed.py

      - name: Executar testes e cobertura
        run: python -m pytest --cov=main --cov=database --cov-report=term-missing

  frontend:
    name: Testes e Build do Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Compilar aplicação
        run: npm run build
